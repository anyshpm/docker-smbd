services:
  samba:
    image: anyshpm/smbd:latest
    container_name: samba
    restart: unless-stopped
    network_mode: host  # 使用主机网络模式以获得最佳性能
    environment:
      - TZ=Asia/Shanghai  # 设置时区
    volumes:
      # 配置文件
      - ./config/smb.conf:/etc/samba/smb.conf:ro
      # Samba 数据目录
      - ./data/lib:/var/lib/samba
      - ./data/log:/var/log/samba
      # 共享目录示例
      - ./share:/share
      - /media:/media:ro
    # 如果不使用 network_mode: host，则需要映射端口
    # ports:
    #   - "445:445"    # SMB
    #   - "139:139"    # NetBIOS
    #   - "137:137/udp"  # NetBIOS name service
    #   - "138:138/udp"  # NetBIOS datagram
    privileged: false  # 不建议使用特权模式
    security_opt:
      - no-new-privileges:true
    # 资源限制
    mem_limit: 1g
    memswap_limit: 2g
    cpu_shares: 512
    healthcheck:
      test: ["CMD-SHELL", "smbclient -L \\\\localhost -U % -m SMB3"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s 